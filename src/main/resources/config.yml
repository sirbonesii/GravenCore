# ============================================================
#   GravenCore — Configuration
# ============================================================
# Sound effects are written with sound:, volume: and pitch: keys,
# the same arguments as /playsound, e.g.:
#   /playsound minecraft:block.anvil.land player @a ~ ~ ~ 100 1.9
# (The old [sound-name, volume, pitch] list form still parses.)


# ============================================================
#   Settings
# ============================================================
settings:
  # Creator name shown at the bottom of item tooltips (<creator>)
  creator: "Senob"


# ============================================================
#   Weapons — Redline Spear
# ============================================================
weapons:
  redline:
    # Damage dealt by a normal melee hit
    melee-damage:
      base: 5.0
      upgraded: 6.5

    # Damage dealt by the Crimson Piercer beam
    ability-damage:
      base: 16.0
      upgraded: 200.0

    # Range of the beam, in blocks
    ability-range:
      base: 30.0
      upgraded: 30.0

    # Beam cooldown, in seconds
    cooldown:
      base: 30
      upgraded: 16

    # Attack speed shown in the tooltip
    attack-speed: 0.87

    # Launch speed when firing the upgraded spear.
    # Negative is intentional: it launches the player backwards
    # (recoil dash).
    launch-velocity: -2.85

    # true = the beam passes straight through solid blocks and walls
    pierce-blocks: true

    sound-effects:
      # Charge-up layer: only players within 30 blocks hear it
      charge:
        sound: "minecraft:block.end_portal_frame.fill"
        volume: 100
        pitch: 0.9
      # Warden charge: plays on the 1st pulse of the charge-up,
      # heard by everyone
      pre-fire:
        sound: "minecraft:entity.warden.sonic_charge"
        volume: 100
        pitch: 0.6
      # Warden boom: plays as the beam fires, heard by everyone
      fire:
        sound: "minecraft:entity.warden.sonic_boom"
        volume: 100
        pitch: 0.6

    # NOTE: not read by the plugin — the spear's lore is hardcoded
    # in RedlineSpear.java. Kept here for reference only.
    # Placeholders: <ability_damage>, <range>, <cooldown>, <creator>
    lore:
      - "<gray>Lunge IV</gray>"
      - "<gray>--------------------</gray>"
      - "<gold><bold>ABILITY</gold><gray>:</gray> <gold><bold>CRIMSON PIERCER</bold></gold>"
      - "<gray>--------------------</gray>"
      - "<dark_gray>• <green>Ability Damage</green><gray>:</gray> <red><ability_damage> ❤</red>"
      - "<dark_gray>• <blue>Ability Range</blue><gray>:</gray> <yellow><range> Blocks</yellow>"
      - "<dark_gray>• <yellow>Cooldown</yellow><gray>:</gray> <gold><cooldown>s 🔥</gold>"
      - "<gray>--------------------</gray>"
      - "<dark_red>✦</dark_red> <gray>Created by</gray> <gradient:#FF3B1F:#FF9E2C><italic><creator></italic></gradient>"

  # ==========================================================
  #   Weapons — Dracula's Plate
  # ==========================================================
  dracula:
    # Vampire's Flight cooldown and duration, in seconds
    cooldown: 30
    duration: 10

    # Defense and armor toughness granted by the plate
    armor: 8.0
    toughness: 3.0

    # Bonus attack damage while wearing the plate
    attack-damage: 2.0

    # Percent of damage dealt returned as health
    lifesteal-percent: 20.0

    # Chance (%) for lifesteal to trigger on a hit
    lifesteal-chance: 85.0

    # Item tier (only "mythical" exists for now)
    tier: "mythical"

    # Block system: chance (%) to block an incoming attack, and
    # flat damage subtracted when a block triggers
    block-rate: 25.0
    block-power: 4.0

    sound-effects:
      block:
        sound: "minecraft:block.anvil.land"
        volume: 100
        pitch: 1.9


# ============================================================
#   Armor — Mythical Set
# ============================================================
armor:
  mythical:
    # Item tier (only "mythical" exists for now)
    tier: "mythical"

    # Max durability per piece (the set is NOT unbreakable)
    durability: 2096

    # Block system: chance (%) for a worn piece to block an
    # incoming attack, and flat damage subtracted on a block
    block-rate: 45.0
    block-power: 4.0

    sound-effects:
      block:
        sound: "minecraft:block.anvil.land"
        volume: 100
        pitch: 1.9

    # Per-piece stats. Knockback resistance uses the vanilla
    # scale: 0.1 = 10% per piece.
    pieces:
      helmet:
        defense: 3.0
        toughness: 3.0
        knockback-resistance: 0.1
      chestplate:
        defense: 8.0
        toughness: 3.0
        knockback-resistance: 0.1
      leggings:
        defense: 6.0
        toughness: 3.0
        knockback-resistance: 0.1
      boots:
        defense: 3.0
        toughness: 3.0
        knockback-resistance: 0.1

  # ==========================================================
  #   Armor — Celerity Boots (standalone, not part of the set)
  # ==========================================================
  mythical-boots:
    # Item tier (only "mythical" exists for now)
    tier: "mythical"

    # Max durability (the boots are NOT unbreakable)
    durability: 2096

    # Time Slow: shift + left-click freezes the world. Tick freeze
    # natively exempts players, so the wearer stays unaffected (plus
    # a speed boost) while everything else stops.
    time-slow:
      enabled: true
      duration: 6.0         # seconds the world stays frozen
      cooldown: 45          # seconds between activations
      speed-boost: 1        # Speed level for the wearer (0 = off)
      freeze-players: true  # also pin other players in place
      weakness-level: 5     # Weakness level for frozen players (0 = off)

    # Block system: same as the Mythical set and Dracula's Plate
    block-rate: 25.0        # % chance to block
    block-power: 4.0        # flat damage blocked

    sound-effects:
      time-slow:
        sound: "minecraft:block.beacon.activate"
        volume: 100
        pitch: 0.8
      block:
        sound: "minecraft:block.anvil.land"
        volume: 100
        pitch: 1.9


# ============================================================
#   Upgrading — Redline Altar
# ============================================================
# A dropper ringed by 8 lodestone pedestals. Place the recipe in
# the dropper (it works like a normal dropper) to lock it in and
# start the ritual.
# Recipe: 4x Dragon's Breath (corners), Heavy Core (top),
# 2x Netherite Ingot (sides), Ghast Tear (bottom), base Redline
# spear (center).
upgrading:
  redline-altar:
    enabled: true

    # Seconds the ritual takes
    ritual-duration: 10.0

    # Play minecraft:block.end_portal.spawn to everyone when the
    # upgraded spear spawns at the end of the ritual
    spawn-sound: true

    # Position offset of the planted spear display, in blocks
    # (16 model pixels = 1 block, so 0.125 = 2 pixels). The axes
    # are relative to the spear's own facing — the offset turns
    # with it as it spins: x sideways, y up/down, z forward/back.
    spear-offset:
      x: 0.0
      y: 0.0
      z: 0.120

    sound-effects:
      start:
        sound: "minecraft:block.beacon.activate"
        volume: 100
        pitch: 0.8
      complete:
        sound: "minecraft:entity.player.levelup"
        volume: 100
        pitch: 1.0
      # Played when the upgraded spear lands, 1.5s after the explosion
      anvil:
        sound: "minecraft:block.anvil.land"
        volume: 100
        pitch: 0.8
      # Played to nearby players when an ingredient locks into the altar
      lock-in:
        sound: "minecraft:entity.creaking.spawn"
        volume: 100
        pitch: 0.1


# ============================================================
#   Alter of Despair
# ============================================================
# Given with /gravencore alter <username> [count]. Placing the
# dropper spawns the glinting block display inside its block.
alter:
  # The block the alter shows. Drives BOTH the item's model
  # (item_model, so the item looks like this block in hand and
  # inventory) and the 3D block the placed display renders.
  block: "minecraft:respawn_anchor"

  # The item's display name and its color as a MiniMessage hex
  # tag. The exact hex matters if your client animates specific
  # colors — the default <#F8F854> is the red-shake trigger.
  display_name: "Alter of Despair"
  hex_code: "<#F8F854>"

  # Scale of the block display (1.0 = exactly one block; 1.01
  # gives it a hair of overhang so it never z-fights the dropper)
  display-scale: 1.01

  # Forced brightness of the display, 0-15 each. It sits inside a
  # solid block, so without this it renders at light level 0.
  # Sky-only (block 0) lights it like an outdoor object.
  brightness-block: 0
  brightness-sky: 15

  # Enchantment glint on the displayed block
  glint: true


# ============================================================
#   Server Resource Pack (MinePack)
# ============================================================
# /gravencore packreload pushes this pack to every online player,
# live. After uploading a new pack zip, paste the new sha1 here,
# then run /gravencore reload followed by /gravencore packreload.
resource-pack:
  url: "https://cdn.minepack.fr/pack/1ef10c4b-7437-48f6-b8e4-f6fa9c10f096"
  sha1: "c3380d60410150e53fdee12c6b2bcbcbeab835d"

  # true = players who decline the pack get disconnected
  required: false

  prompt: "Pack hosted by minepack.fr for free"
