# ============================================================
#   GravenCore — Configuration
# ============================================================



# ============================================================
#   Settings
# ============================================================
settings:
  # Creator name shown at the bottom of item tooltips (<creator>)
  creator: "Senob"

# Obfuscate player names while they have the invisibility effect:
# kill-feed names and TAB names render scrambled while it is active.
# show-in-tab: false (default) hides invisible players from TAB entirely.
name-obfuscation:
  obfuscated: true
  show-in-tab: false

# Boss bar title shown to a vanished player (plain text renders green,
# MiniMessage tags allowed). Both the list form below and the plain
# vanished-name.display-name form work.
vanished-name:
  - display-name: "You are [👻]"



# ============================================================
#   Server Resource Pack (MinePack)
# ============================================================
# /gravencore packreload pushes this pack to every online player,
# live. After uploading a new pack zip, paste the new sha1 here,
# then run /gravencore reload followed by /gravencore packreload.
resource-pack:
  url: "https://cdn.minepack.fr/pack/1ef10c4b-7437-48f6-b8e4-f6fa9c10f096"
  sha1: "c3380d60410150e53fdee12c6b2bcbcbeab835d"

  # true = players who decline the pack get disconnected
  required: true

  prompt: "Pack hosted by Senob"
