# ============================================================
#   GravenCore — Configuration
# ============================================================



# ============================================================
#   Settings
# ============================================================
settings:
  # Creator name shown at the bottom of item tooltips (<creator>)
  creator: "Senob"
  # Name inside the [GravenCore] chat prefix — change this to anything.
  # Brackets and the gradient are added automatically, so just put the
  # name here (a value already wrapped in [ ] works too).
  prefix: "GravenCore"

# Obfuscate player names while they have the invisibility effect:
# kill-feed names and TAB names render scrambled while it is active.
# show-in-tab: false (default) hides invisible players from TAB entirely.
name-obfuscation:
  obfuscated: true
  show-in-tab: false

# Admin mode (/admin toggle): an admin with mode OFF plays as a
# regular player — GravenCore admin commands refuse, vanished players
# hide from them, and the commands below are blocked server-wide.
# Labels match without namespace, so "give" also blocks "/minecraft:give".
# "/admin" itself is never blocked (it is the way back on). Missing
# section = the defaults below; /gravencore reload picks up edits.
admin-mode:
  blocked-commands:
    - "gamemode"
    - "give"
    - "tp"
    - "teleport"
    - "summon"
    - "setblock"
    - "fill"
    - "op"
    - "deop"
    - "ban"
    - "pardon"
    - "kick"
    - "whitelist"
    - "difficulty"
    - "gamerule"
    - "time"
    - "weather"
    - "effect"
    - "enchant"
    - "xp"
    - "clear"
    - "kill"
    - "spawnpoint"
    - "setworldspawn"
    - "save-all"
    - "stop"
    - "reload"
    - "lp"
    - "luckperms"


# ============================================================
#   Server Resource Pack (MinePack)
# ============================================================
# /gravencore packreload pushes this pack to every online player,
# live. After uploading a new pack zip, paste the new sha1 here,
# then run /gravencore reload followed by /gravencore packreload.
resource-pack:
  url: "https://cdn.minepack.fr/pack/1ef10c4b-7437-48f6-b8e4-f6fa9c10f096"
  sha1: "c3380d60410150e53fdee12c6b2bcbcbeab835d"

  # true = players who decline the pack get disconnected
  required: true

  prompt: "Pack hosted by Senob"
