# ==========================================
#          GravenCore Configuration
# ==========================================
# Migrated 2026-10-17 from the old flat "TheRedline" format to the
# nested structure GravenConfig actually reads (settings.*, weapons.*).
# Original file preserved as config.yml.backup.
#
# NOTE: the old file's values were never live (the code only read
# nested paths), so the server was running on code defaults. Migrating
# these values in WILL change behavior - see notes below.

settings:
  # Creator name shown at the bottom of item tooltips (<creator> placeholder)
  creator: "Senob"

weapons:
  redline:
    # Normal Base Melee Damage
    melee-damage:
      base: 5.0
      upgraded: 6.5

    # Spear Ability Damage
    ability-damage:
      base: 16.0
      upgraded: 200.0

    # Range (in blocks) of the flame beam ability
    ability-range:
      base: 30.0
      upgraded: 30.0

    # Ability cooldown in seconds (old key was "ability-cooldown").
    # NOTE: old file had base: 30 which was dormant; the server was
    # actually running on the code default of 20.
    cooldown:
      base: 30
      upgraded: 16

    # Base attack speed (shown in lore as "X Attack Speed")
    attack-speed: 0.87

    # Launch speed multiplier when firing the upgraded spear.
    # Negative = launches the player backwards (recoil dash) - intentional.
    launch-velocity: -2.85

    # Whether the ability beam passes straight through solid blocks/walls
    pierce-blocks: true

    # Spear lore / item description.
    # Placeholders: <ability_damage>, <range>, <cooldown>, <creator>
    lore:
      - "<gray>Lunge IV</gray>"
      - "<gray>--------------------</gray>"
      - "<gold><bold>ABILITY</gold><gray>:</gray> <gold><bold>CRIMSON PIERCER</bold></gold>"
      - "<gray>--------------------</gray>"
      - "<dark_gray>• <green>Ability Damage</green><gray>:</gray> <red><ability_damage> ❤</red>"
      - "<dark_gray>• <blue>Ability Range</blue><gray>:</gray> <yellow><range> Blocks</yellow>"
      - "<dark_gray>• <yellow>Cooldown</yellow><gray>:</gray> <gold><cooldown>s 🔥</gold>"
      - "<gray>--------------------</gray>"
      - "<dark_red>✦</dark_red> <gray>Created by</gray> <gradient:#FF3B1F:#FF9E2C><italic><creator></italic></gradient>"

  dracula:
    # No dracula section existed in the old file - these are the values
    # the server was already running on (code defaults).
    cooldown: 30
    duration: 10
    armor: 8.0
    toughness: 3.0

    # Bonus attack damage granted while wearing the plate
    attack-damage: 2.0

    # Percent of damage dealt returned as health while wearing the plate
    lifesteal-percent: 20.0

    # Chance (%) for lifesteal to trigger on a hit
    lifesteal-chance: 85.0

    # Item tier (full tier system coming later; only "mythical" for now)
    tier: "mythical"

    # Block system: chance (percent, 0-100) to trigger a block on an incoming
    # attack while wearing the plate, and flat damage subtracted when it triggers
    block-rate: 25.0
    block-power: 4.0

    # Sound effects: block proc sound as [sound-name, volume, pitch]
    # Same args as: /playsound minecraft:block.anvil.land player @a ~ ~ ~ 100 1.9
    sound-effects:
      block:
        - minecraft:block.anvil.land
        - 100
        - 1.9

# --- Mythical Armor Set (prototype) ---
# The default Mythical netherite set. Per-piece defensive stats;
# knockback-resistance uses vanilla scale (0.1 = 10% per piece).
armor:
  mythical:
    # Item tier (full tier system coming later; only "mythical" for now)
    tier: "mythical"

    # Max durability per piece (the set is NOT unbreakable)
    durability: 2096

    # Block system: chance (percent, 0-100) for a worn piece to trigger a block
    # on an incoming attack, and flat damage subtracted when it triggers
    block-rate: 45.0
    block-power: 4.0

    # Sound effects: block proc sound as [sound-name, volume, pitch]
    # Same args as: /playsound minecraft:block.anvil.land player @a ~ ~ ~ 100 1.9
    sound-effects:
      block:
        - minecraft:block.anvil.land
        - 100
        - 1.9
      time-slow:
        - minecraft:block.beacon.activate
        - 100
        - 0.8

    # Boots ability: shift + left-click slows everything nearby except the wearer
    abilities:
      time-slow:
        enabled: true
        duration: 6.0   # seconds of slowness applied
        cooldown: 45    # seconds between activations
        radius: 12.0    # blocks around the wearer
        amplifier: 5    # Slowness VI (each level is -15% move speed)

    pieces:
      helmet:
        defense: 3.0
        toughness: 3.0
        knockback-resistance: 0.1
      chestplate:
        defense: 8.0
        toughness: 3.0
        knockback-resistance: 0.1
      leggings:
        defense: 6.0
        toughness: 3.0
        knockback-resistance: 0.1
      boots:
        defense: 3.0
        toughness: 3.0
        knockback-resistance: 0.1

# --- Retired keys (kept for reference, not read by the code) ---
