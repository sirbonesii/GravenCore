# ============================================================
#   GravenCore — Configuration
# ============================================================



# ============================================================
#   Settings
# ============================================================
settings:
  # Creator name shown at the bottom of item tooltips (<creator>)
  creator: "Senob"


# ============================================================
#   Weapons — Redline Spear
# ============================================================
weapons:
  redline:
    melee-damage:
      base: 5.0
      upgraded: 6.5

    ability-damage:
      base: 16.0
      upgraded: 200.0

    ability-range:
      base: 30.0
      upgraded: 30.0

    cooldown:
      base: 30
      upgraded: 16

    attack-speed: 0.87
    launch-velocity: -2.85
    pierce-blocks: true

    sound-effects:
      charge:
        sound: "minecraft:block.end_portal_frame.fill"
        volume: 100
        pitch: 0.9

      pre-fire:
        sound: "minecraft:entity.warden.sonic_charge"
        volume: 100
        pitch: 0.6

      fire:
        sound: "minecraft:entity.warden.sonic_boom"
        volume: 100
        pitch: 0.6

  # ==========================================================
  #   Weapons — Dracula's Plate
  # ==========================================================
  dracula:
    tier: "mythical"
    cooldown: 30
    duration: 10

    armor: 8.0
    toughness: 3.0
    attack-damage: 2.0
    lifesteal-percent: 20.0
    lifesteal-chance: 85.0
    block-rate: 25.0
    block-power: 4.0

    sound-effects:
      block:
        sound: "minecraft:block.anvil.land"
        volume: 100
        pitch: 1.9


# ============================================================
#   Armor — Mythical Set
# ============================================================
armor:
  mythical:
    tier: "mythical"

    durability: 2096
    block-rate: 45.0
    block-power: 4.0

    sound-effects:
      block:
        sound: "minecraft:block.anvil.land"
        volume: 100
        pitch: 1.9

    # Per-piece stats. Knockback resistance uses the vanilla
    # scale: 0.1 = 10% per piece.
    pieces:
      helmet:
        defense: 3.0
        toughness: 3.0
        knockback-resistance: 0.1
      chestplate:
        defense: 8.0
        toughness: 3.0
        knockback-resistance: 0.1
      leggings:
        defense: 6.0
        toughness: 3.0
        knockback-resistance: 0.1
      boots:
        defense: 3.0
        toughness: 3.0
        knockback-resistance: 0.1

  # ==========================================================
  #   Armor — Celerity Boots (standalone, not part of the set)
  # ==========================================================
  mythical-boots:
    tier: "mythical"

    durability: 2096

    # Time Slow: shift + left-click freezes the world. Tick freeze
    # natively exempts players, so the wearer stays unaffected (plus
    # a speed boost) while everything else stops.
    time-slow:
      enabled: true
      duration: 6.0
      cooldown: 45
      speed-boost: 1
      freeze-players: true
      weakness-level: 5

    block-rate: 25.0
    block-power: 4.0

    sound-effects:
      time-slow:
        sound: "minecraft:block.beacon.activate"
        volume: 100
        pitch: 0.8
      block:
        sound: "minecraft:block.anvil.land"
        volume: 100
        pitch: 1.9


# ============================================================
#   Upgrading — Redline Altar
# ============================================================
# A dropper ringed by 8 lodestone pedestals. Place the recipe in
# the dropper (it works like a normal dropper) to lock it in and
# start the ritual.
# Recipe: 4x Dragon's Breath (corners), Heavy Core (top),
# 2x Netherite Ingot (sides), Ghast Tear (bottom), base Redline
# spear (center).
upgrading:
  redline-altar:
    enabled: true

    ritual-duration: 10.0
    spawn-sound: true

    spear-offset:
      x: 0.0
      y: 0.0
      z: 0.120

    sound-effects:
      start:
        sound: "minecraft:block.beacon.activate"
        volume: 100
        pitch: 0.8

      complete:
        sound: "minecraft:entity.player.levelup"
        volume: 100
        pitch: 1.0

      anvil:
        sound: "minecraft:block.anvil.land"
        volume: 100
        pitch: 0.8

      lock-in:
        sound: "minecraft:entity.creaking.spawn"
        volume: 100
        pitch: 0.1


# ============================================================
#   Alter of Despair
# ============================================================
# Given with /gravencore alter <username> [count]. Placing the
# dropper spawns the glinting block display inside its block.
alter:
  # The block the alter shows. Drives BOTH the item's model
  # (item_model, so the item looks like this block in hand and
  # inventory) and the 3D block the placed display renders.
  block: "minecraft:respawn_anchor"

  # The item's display name and its color as a MiniMessage hex
  # tag. The exact hex matters if your client animates specific
  # colors — the default <#F8F854> is the red-shake trigger.
  display_name: "Alter of Despair"
  hex_code: "<#F8F854>"

  # Scale of the block display (1.0 = exactly one block; 1.01
  # gives it a hair of overhang so it never z-fights the dropper)
  display-scale: 1.01

  # Forced brightness of the display, 0-15 each. It sits inside a
  # solid block, so without this it renders at light level 0.
  # Sky-only (block 0) lights it like an outdoor object.
  brightness-block: 0
  brightness-sky: 15

  # Enchantment glint on the displayed block
  glint: true


# ============================================================
#   Server Resource Pack (MinePack)
# ============================================================
# /gravencore packreload pushes this pack to every online player,
# live. After uploading a new pack zip, paste the new sha1 here,
# then run /gravencore reload followed by /gravencore packreload.
resource-pack:
  url: "https://cdn.minepack.fr/pack/1ef10c4b-7437-48f6-b8e4-f6fa9c10f096"
  sha1: "c3380d60410150e53fdee12c6b2bcbcbeab835d"

  # true = players who decline the pack get disconnected
  required: true

  prompt: "Pack hosted by Senob"
