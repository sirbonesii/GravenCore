# ==================================================================
#  GravenCore — Armor Tiers
#  One section per armor set: mythical, legendary, epic, rare,
#  uncommon, common. Each set's stats, block tuning and piece
#  defenses live here. (The standalone Celerity Boots are NOT
#  here — they stay under armor.mythical-boots in config.yml.)
#  Changes need a server restart to take effect.
# ==================================================================
mythical:
  tier: "mythical"

  durability: 2096
  block-rate: 45.0
  block-power: 4.0

  sound-effects:
    block:
      sound: "minecraft:block.anvil.land"
      volume: 100
      pitch: 1.9

  # Per-piece stats. Knockback resistance uses the vanilla
  # scale: 0.1 = 10% per piece.
  pieces:
    helmet:
      defense: 3.0
      toughness: 3.0
      knockback-resistance: 0.1
    chestplate:
      defense: 8.0
      toughness: 3.0
      knockback-resistance: 0.1
    leggings:
      defense: 6.0
      toughness: 3.0
      knockback-resistance: 0.1
    boots:
      defense: 3.0
      toughness: 3.0
      knockback-resistance: 0.1

